<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>当日券</title>
<style>
  :root{
    --a:#0ea5e9;  --a-minus:#bae6fd;  --a-ink:#0369a1;
    --s:#8b5cf6;  --s-minus:#ddd6fe;  --s-ink:#6d28d9;
    --ss:#f59e0b; --ss-minus:#fde68a; --ss-ink:#b45309;
    --ink:#0f172a; --muted:#64748b; --bg:#eef2f7;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; min-height:100dvh;
    -webkit-user-select:none; user-select:none;
  }
  header{
    position:relative;
    padding:calc(16px + env(safe-area-inset-top)) 20px 14px;
    text-align:center; font-size:20px; font-weight:800; letter-spacing:.05em;
  }
  .qr-btn{
    position:absolute; right:14px; top:calc(12px + env(safe-area-inset-top));
    border:1.5px solid rgba(15,23,42,.18); background:#fff; color:var(--ink);
    font-size:13px; font-weight:800; letter-spacing:.04em;
    padding:8px 12px; border-radius:12px; cursor:pointer; touch-action:manipulation;
  }
  .qr-btn:active{transform:scale(.93);}
  main{ flex:1; padding:6px 16px 16px; display:flex; flex-direction:column; gap:14px; }
  .card{
    background:#fff; border-radius:24px; padding:18px 20px 16px;
    box-shadow:0 8px 24px rgba(15,23,42,.07); border:1px solid rgba(15,23,42,.04);
  }
  .row1{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px;}
  .name{font-size:24px; font-weight:900; letter-spacing:.02em;}
  .price{font-size:15px; color:var(--muted); font-weight:700;}
  .controls{display:flex; align-items:center; justify-content:space-between;}
  .btn{
    width:76px; height:76px; border:none; border-radius:50%;
    font-size:40px; font-weight:600; color:#fff; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; touch-action:manipulation;
    transition:transform .07s ease, filter .07s ease;
  }
  .btn:active{transform:scale(.88); filter:brightness(.93);}
  .btn:disabled{opacity:.4; cursor:default;}
  .btn:disabled:active{transform:none; filter:none;}
  .count{font-size:50px; font-weight:800; min-width:60px; text-align:center; font-variant-numeric:tabular-nums;}
  .subtotal{margin-top:12px; text-align:right; font-size:15px; color:var(--muted); font-weight:700;}
  .a  .btn.plus{background:var(--a);}   .a  .btn.minus{background:var(--a-minus);  color:var(--a-ink);}
  .s  .btn.plus{background:var(--s);}   .s  .btn.minus{background:var(--s-minus);  color:var(--s-ink);}
  .ss .btn.plus{background:var(--ss);}  .ss .btn.minus{background:var(--ss-minus); color:var(--ss-ink);}
  .tag{font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; margin-left:8px; vertical-align:middle;}
  .a .tag{background:#e0f2fe; color:var(--a-ink);}
  .s .tag{background:#ede9fe; color:var(--s-ink);}
  .ss .tag{background:#fef3c7; color:var(--ss-ink);}
  .total{
    position:sticky; bottom:0; background:var(--ink); color:#fff;
    padding:16px 20px calc(16px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 24px rgba(15,23,42,.18);
    display:flex; align-items:center; gap:14px;
  }
  .reset{
    flex:0 0 auto; border:1.5px solid rgba(255,255,255,.35); background:transparent;
    color:#fff; font-size:15px; font-weight:700; padding:12px 16px; border-radius:14px;
    cursor:pointer; touch-action:manipulation;
  }
  .reset:active{background:rgba(255,255,255,.12);}
  .total-r{margin-left:auto; text-align:right; line-height:1.1; min-width:0;}
  .total-label{font-size:13px; color:#94a3b8; font-weight:700;}
  .total-amount{font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .total-amount .yen{font-size:22px; margin-right:2px;}

  /* QRモーダル */
  .qr-modal{
    position:fixed; inset:0; background:rgba(15,23,42,.6); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:24px;
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  }
  .qr-modal[hidden]{display:none;}
  .qr-card{
    background:#fff; border-radius:24px; padding:24px; text-align:center;
    max-width:320px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,.3);
  }
  .qr-card h2{font-size:17px; margin-bottom:4px;}
  .qr-card p{font-size:13px; color:var(--muted); margin-bottom:16px;}
  .qr-card img{width:240px; height:240px; image-rendering:pixelated; border-radius:8px;}
  .qr-url{font-size:12px; color:#475569; word-break:break-all; margin:14px 0 2px; font-weight:600;}
  .qr-close{
    margin-top:14px; width:100%; border:none; background:var(--ink); color:#fff;
    font-size:16px; font-weight:700; padding:14px; border-radius:14px; cursor:pointer;
  }

  /* 同期ステータス */
  .sync{display:flex; align-items:center; justify-content:center; gap:6px;
        font-size:12px; font-weight:700; color:#94a3b8; padding:0 0 4px;}
  .sync .dot{width:8px; height:8px; border-radius:50%; background:#94a3b8; flex:0 0 auto;}
</style>
</head>
<body>
  <header>
    🎟️ 当日券
    <button class="qr-btn" id="qrBtn" aria-label="このページのQRコードを表示">QR</button>
  </header>
  <div class="sync" id="sync"><span class="dot"></span><span class="txt">…</span></div>

  <main>
    <section class="card a">
      <div class="row1"><span class="name">A<span class="tag">スタンダード</span></span><span class="price">¥5,000</span></div>
      <div class="controls">
        <button class="btn minus" data-act="minus:a" id="minus-a" aria-label="Aを減らす">−</button>
        <span class="count" id="count-a">0</span>
        <button class="btn plus" data-act="plus:a" aria-label="Aを増やす">+</button>
      </div>
      <div class="subtotal" id="sub-a">小計 ¥0</div>
    </section>

    <section class="card s">
      <div class="row1"><span class="name">S<span class="tag">スペシャル</span></span><span class="price">¥10,000</span></div>
      <div class="controls">
        <button class="btn minus" data-act="minus:s" id="minus-s" aria-label="Sを減らす">−</button>
        <span class="count" id="count-s">0</span>
        <button class="btn plus" data-act="plus:s" aria-label="Sを増やす">+</button>
      </div>
      <div class="subtotal" id="sub-s">小計 ¥0</div>
    </section>

    <section class="card ss">
      <div class="row1"><span class="name">SS<span class="tag">プレミアム</span></span><span class="price">¥15,000</span></div>
      <div class="controls">
        <button class="btn minus" data-act="minus:ss" id="minus-ss" aria-label="SSを減らす">−</button>
        <span class="count" id="count-ss">0</span>
        <button class="btn plus" data-act="plus:ss" aria-label="SSを増やす">+</button>
      </div>
      <div class="subtotal" id="sub-ss">小計 ¥0</div>
    </section>
  </main>

  <div class="total">
    <button class="reset" id="reset">リセット</button>
    <div class="total-r">
      <div class="total-label">合計 <span id="total-count">0</span>枚</div>
      <div class="total-amount"><span class="yen">¥</span><span id="total">0</span></div>
    </div>
  </div>

  <div class="qr-modal" id="qrModal" hidden>
    <div class="qr-card">
      <h2>当日券ページのQRコード</h2>
      <p>スマホのカメラで読み取って開けます</p>
      <img src="qr-tickets.png" alt="当日券ページURLのQRコード" width="240" height="240">
      <div class="qr-url">https://riogroup-tokyo.github.io/drink-pos/tickets.html</div>
      <button class="qr-close" id="qrClose">閉じる</button>
    </div>
  </div>

<script type="module">
  import { startSync } from "./sync.js";

  const PRICES = { a: 5000, s: 10000, ss: 15000 };
  const FIELDS = ["a", "s", "ss"];
  const fmt = n => n.toLocaleString("ja-JP");

  function render(s){
    let total = 0, count = 0;
    for (const k of FIELDS) {
      const v = s[k] || 0;
      const sub = v * PRICES[k];
      total += sub; count += v;
      document.getElementById("count-" + k).textContent = v;
      document.getElementById("sub-" + k).textContent = "小計 ¥" + fmt(sub);
      document.getElementById("minus-" + k).disabled = v === 0;
    }
    document.getElementById("total").textContent = fmt(total);
    document.getElementById("total-count").textContent = count;
  }

  const STAT = {
    local:      ["#94a3b8", "ローカルのみ（このデバイス）"],
    connecting: ["#f59e0b", "接続中…"],
    online:     ["#16a34a", "全端末で同期中"],
    offline:    ["#ef4444", "オフライン（復帰待ち）"],
  };
  function setStatus(st){
    const el = document.getElementById("sync"); if (!el) return;
    const [c, t] = STAT[st] || STAT.local;
    el.querySelector(".dot").style.background = c;
    const tx = el.querySelector(".txt"); tx.textContent = t; tx.style.color = c;
  }

  const sync = startSync({ fields: FIELDS, cacheKey: "day-ticket-pos", onChange: render, onStatus: setStatus });

  document.querySelectorAll("[data-act]").forEach(btn => {
    btn.addEventListener("click", () => {
      const [act, k] = btn.dataset.act.split(":");
      sync.bump(k, act === "plus" ? 1 : -1);
      if (navigator.vibrate) navigator.vibrate(8);
    });
  });

  document.getElementById("reset").addEventListener("click", () => {
    if (confirm("会計をリセットしますか？（全端末がリセットされます）")) sync.reset();
  });

  const qrModal = document.getElementById("qrModal");
  document.getElementById("qrBtn").addEventListener("click", () => { qrModal.hidden = false; });
  document.getElementById("qrClose").addEventListener("click", () => { qrModal.hidden = true; });
  qrModal.addEventListener("click", (e) => { if (e.target === qrModal) qrModal.hidden = true; });
</script>
</body>
</html>
