<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ドリンク会計</title>
<style>
  :root{
    --soft:#0ea5e9; --soft-minus:#bae6fd; --soft-ink:#0369a1;
    --alc:#f59e0b;  --alc-minus:#fde68a;  --alc-ink:#b45309;
    --ink:#0f172a; --muted:#64748b; --bg:#eef2f7;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; min-height:100dvh;
    -webkit-user-select:none; user-select:none;
  }
  header{
    position:relative;
    padding:calc(16px + env(safe-area-inset-top)) 20px 14px;
    text-align:center; font-size:20px; font-weight:800; letter-spacing:.05em;
  }
  .qr-btn{
    position:absolute; right:14px; top:calc(12px + env(safe-area-inset-top));
    border:1.5px solid rgba(15,23,42,.18); background:#fff; color:var(--ink);
    font-size:13px; font-weight:800; letter-spacing:.06em;
    padding:8px 13px; border-radius:12px; cursor:pointer; touch-action:manipulation;
  }
  .qr-btn:active{transform:scale(.93);}
  .nav-btn{
    position:absolute; left:14px; top:calc(12px + env(safe-area-inset-top));
    border:1.5px solid rgba(15,23,42,.18); background:#fff; color:var(--ink);
    font-size:13px; font-weight:800; letter-spacing:.04em;
    padding:8px 12px; border-radius:12px; text-decoration:none; display:inline-block;
    cursor:pointer; touch-action:manipulation;
  }
  .nav-btn:active{transform:scale(.93);}
  main{ flex:1; padding:6px 16px 16px; display:flex; flex-direction:column; gap:16px; }
  .card{
    background:#fff; border-radius:24px; padding:20px 20px 18px;
    box-shadow:0 8px 24px rgba(15,23,42,.07); border:1px solid rgba(15,23,42,.04);
  }
  .row1{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px;}
  .name{font-size:23px; font-weight:800;}
  .price{font-size:15px; color:var(--muted); font-weight:700;}
  .controls{display:flex; align-items:center; justify-content:space-between;}
  .btn{
    width:80px; height:80px; border:none; border-radius:50%;
    font-size:42px; font-weight:600; color:#fff; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; touch-action:manipulation;
    transition:transform .07s ease, filter .07s ease;
  }
  .btn:active{transform:scale(.88); filter:brightness(.93);}
  .btn:disabled{opacity:.4; cursor:default;}
  .btn:disabled:active{transform:none; filter:none;}
  .count{font-size:52px; font-weight:800; min-width:64px; text-align:center; font-variant-numeric:tabular-nums;}
  .subtotal{margin-top:14px; text-align:right; font-size:15px; color:var(--muted); font-weight:700;}
  .soft .btn.plus{background:var(--soft);}
  .soft .btn.minus{background:var(--soft-minus); color:var(--soft-ink);}
  .alc  .btn.plus{background:var(--alc);}
  .alc  .btn.minus{background:var(--alc-minus); color:var(--alc-ink);}
  .total{
    position:sticky; bottom:0; background:var(--ink); color:#fff;
    padding:16px 20px calc(16px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 24px rgba(15,23,42,.18);
    display:flex; align-items:center; gap:14px;
  }
  .reset{
    flex:0 0 auto; border:1.5px solid rgba(255,255,255,.35); background:transparent;
    color:#fff; font-size:15px; font-weight:700; padding:12px 16px; border-radius:14px;
    cursor:pointer; touch-action:manipulation;
  }
  .reset:active{background:rgba(255,255,255,.12);}
  .total-r{margin-left:auto; text-align:right; line-height:1.1;}
  .total-label{font-size:13px; color:#94a3b8; font-weight:700;}
  .total-amount{font-size:38px; font-weight:800; font-variant-numeric:tabular-nums;}
  .total-amount .yen{font-size:24px; margin-right:2px;}

  /* スタッフ（小さめ・無料） */
  .staff{padding:14px 18px;}
  .staff-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .staff-name{font-size:17px; font-weight:800; display:flex; align-items:center; gap:8px;}
  .free-badge{font-size:11px; color:#15803d; background:#dcfce7; padding:3px 9px; border-radius:999px; font-weight:800;}
  .staff-sub{font-size:12px; color:var(--muted); font-weight:600; margin-top:3px;}
  .staff-ctrl{display:flex; align-items:center; gap:10px;}
  .btn-sm{
    width:52px; height:52px; border:none; border-radius:50%;
    font-size:28px; font-weight:600; color:#fff; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; touch-action:manipulation; transition:transform .07s ease;
  }
  .btn-sm:active{transform:scale(.86);}
  .btn-sm:disabled{opacity:.4; cursor:default;}
  .staff .btn-sm.plus{background:#16a34a;}
  .staff .btn-sm.minus{background:#bbf7d0; color:#15803d;}
  .count-sm{font-size:30px; font-weight:800; min-width:34px; text-align:center; font-variant-numeric:tabular-nums;}

  /* QRモーダル */
  .qr-modal{
    position:fixed; inset:0; background:rgba(15,23,42,.6); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:24px;
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  }
  .qr-modal[hidden]{display:none;}
  .qr-card{
    background:#fff; border-radius:24px; padding:24px; text-align:center;
    max-width:320px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,.3);
  }
  .qr-card h2{font-size:17px; margin-bottom:4px;}
  .qr-card p{font-size:13px; color:var(--muted); margin-bottom:16px;}
  .qr-card img{width:240px; height:240px; image-rendering:pixelated; border-radius:8px;}
  .qr-url{font-size:12px; color:#475569; word-break:break-all; margin:14px 0 2px; font-weight:600;}
  .qr-close{
    margin-top:14px; width:100%; border:none; background:var(--ink); color:#fff;
    font-size:16px; font-weight:700; padding:14px; border-radius:14px; cursor:pointer;
  }

  /* 同期ステータス */
  .sync{display:flex; align-items:center; justify-content:center; gap:6px;
        font-size:12px; font-weight:700; color:#94a3b8; padding:0 0 4px;}
  .sync .dot{width:8px; height:8px; border-radius:50%; background:#94a3b8; flex:0 0 auto;}
</style>
</head>
<body>
  <header><a class="nav-btn" href="tickets.html" aria-label="当日券へ">🎟️ 当日券</a>🍻 ドリンク会計<button class="qr-btn" id="qrBtn" aria-label="アプリのQRコードを表示">QR</button></header>
  <div class="sync" id="sync"><span class="dot"></span><span class="txt">…</span></div>

  <main>
    <section class="card soft">
      <div class="row1"><span class="name">ソフトドリンク</span><span class="price">¥300</span></div>
      <div class="controls">
        <button class="btn minus" data-act="minus:soft" id="minus-soft" aria-label="ソフトドリンクを減らす">−</button>
        <span class="count" id="count-soft">0</span>
        <button class="btn plus" data-act="plus:soft" aria-label="ソフトドリンクを増やす">+</button>
      </div>
      <div class="subtotal" id="sub-soft">小計 ¥0</div>
    </section>

    <section class="card alc">
      <div class="row1"><span class="name">アルコール</span><span class="price">¥500</span></div>
      <div class="controls">
        <button class="btn minus" data-act="minus:alc" id="minus-alc" aria-label="アルコールを減らす">−</button>
        <span class="count" id="count-alc">0</span>
        <button class="btn plus" data-act="plus:alc" aria-label="アルコールを増やす">+</button>
      </div>
      <div class="subtotal" id="sub-alc">小計 ¥0</div>
    </section>

    <section class="card staff">
      <div class="staff-row">
        <div>
          <div class="staff-name">スタッフ <span class="free-badge">無料</span></div>
          <div class="staff-sub">ソフトの合計数に計上されます</div>
        </div>
        <div class="staff-ctrl">
          <button class="btn-sm minus" data-act="minus:staff" id="minus-staff" aria-label="スタッフを減らす">−</button>
          <span class="count-sm" id="count-staff">0</span>
          <button class="btn-sm plus" data-act="plus:staff" aria-label="スタッフを増やす">+</button>
        </div>
      </div>
    </section>
  </main>

  <div class="total">
    <button class="reset" id="reset">リセット</button>
    <div class="total-r">
      <div class="total-label">合計 <span id="total-count">0</span>点</div>
      <div class="total-amount"><span class="yen">¥</span><span id="total">0</span></div>
    </div>
  </div>

  <div class="qr-modal" id="qrModal" hidden>
    <div class="qr-card">
      <h2>このアプリのQRコード</h2>
      <p>スマホのカメラで読み取って開けます</p>
      <img src="qr.png" alt="アプリURLのQRコード" width="240" height="240">
      <div class="qr-url">https://riogroup-tokyo.github.io/drink-pos/</div>
      <button class="qr-close" id="qrClose">閉じる</button>
    </div>
  </div>

<script type="module">
  import { startSync } from "./sync.js";

  const PRICES = { soft: 300, alc: 500, staff: 0 };
  const FIELDS = ["soft", "alc", "staff"];
  const fmt = n => n.toLocaleString("ja-JP");

  function render(s){
    const soft = s.soft || 0, alc = s.alc || 0, staff = s.staff || 0;
    const softTotal = soft + staff;                  // ソフト合計（スタッフ無料分を含む）
    const money = soft * PRICES.soft + alc * PRICES.alc; // スタッフは¥0
    const count = soft + alc + staff;                // 合計点数（スタッフ込）

    document.getElementById("count-soft").textContent = soft;
    document.getElementById("count-alc").textContent = alc;
    document.getElementById("count-staff").textContent = staff;

    document.getElementById("sub-soft").textContent =
      staff > 0
        ? "小計 ¥" + fmt(soft * PRICES.soft) + " ・ ソフト計 " + softTotal + "杯"
        : "小計 ¥" + fmt(soft * PRICES.soft);
    document.getElementById("sub-alc").textContent = "小計 ¥" + fmt(alc * PRICES.alc);

    document.getElementById("minus-soft").disabled = soft === 0;
    document.getElementById("minus-alc").disabled = alc === 0;
    document.getElementById("minus-staff").disabled = staff === 0;

    document.getElementById("total").textContent = fmt(money);
    document.getElementById("total-count").textContent = count;
  }

  const STAT = {
    local:      ["#94a3b8", "ローカルのみ（このデバイス）"],
    connecting: ["#f59e0b", "接続中…"],
    online:     ["#16a34a", "全端末で同期中"],
    offline:    ["#ef4444", "オフライン（復帰待ち）"],
  };
  function setStatus(st){
    const el = document.getElementById("sync"); if (!el) return;
    const [c, t] = STAT[st] || STAT.local;
    el.querySelector(".dot").style.background = c;
    const tx = el.querySelector(".txt"); tx.textContent = t; tx.style.color = c;
  }

  const sync = startSync({ fields: FIELDS, cacheKey: "drink-pos", onChange: render, onStatus: setStatus });

  document.querySelectorAll("[data-act]").forEach(btn => {
    btn.addEventListener("click", () => {
      const [act, k] = btn.dataset.act.split(":");
      sync.bump(k, act === "plus" ? 1 : -1);
      if (navigator.vibrate) navigator.vibrate(8);
    });
  });

  document.getElementById("reset").addEventListener("click", () => {
    if (confirm("会計をリセットしますか？（全端末がリセットされます）")) sync.reset();
  });

  // QRコード表示
  const qrModal = document.getElementById("qrModal");
  document.getElementById("qrBtn").addEventListener("click", () => { qrModal.hidden = false; });
  document.getElementById("qrClose").addEventListener("click", () => { qrModal.hidden = true; });
  qrModal.addEventListener("click", (e) => { if (e.target === qrModal) qrModal.hidden = true; });
</script>
</body>
</html>
